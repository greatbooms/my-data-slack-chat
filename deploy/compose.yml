services:
  app:
    image: ${IMAGE:-ghcr.io/greatbooms/my-data-slack-chat:latest}
    container_name: my-data-slack-chat
    network_mode: host
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "50506"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:$${SERVER_PORT:-50506}/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
